# staticcheck configuration for ZoneLint
# https://staticcheck.io/docs/configuration/

checks:
  - all
  - '-ST1000'  # package comment style is enforced via generated docs
  - '-ST1003'  # naming: underscore names in specific contexts
  - '-QF1001'  # allow multi-line struct literals for readability
  - '-QF1003'  # allow type-switch with common cases
  - '-QF1015'  # allow range-copy in controlled test fixtures
  - '-SA4000'  # string<->[]byte conversions for wire format
  - '-SA5011'  # pointer to loop variable is intentional in some aggregations
  - '-U1000'  # allow unused helpers used via reflection/fuzz
