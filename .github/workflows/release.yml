name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  release:
    name: Build and Sign Releases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-arm64
            goos: linux
            goarch: arm64
          - os: linux-amd64
            goos: linux
            goarch: amd64
          - os: darwin-arm64
            goos: darwin
            goarch: arm64
          - os: darwin-amd64
            goos: darwin
            goarch: amd64
          - os: windows-arm64
            goos: windows
            goarch: arm64
          - os: windows-amd64
            goos: windows
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build ${{ matrix.os }}
        run: |
          export GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}
          go build -trimpath -ldflags "-s -w -X github.com/example/ZoneLint/internal/version.Version=${GITHUB_REF_NAME}" -o dist/zonelint-${{ matrix.os }} ./cmd/zonelint

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.sha256

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: dist/

  sign:
    name: Sign Artifacts
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: dist/

      - name: Generate provenance
        run: |
          echo "Provenance generation placeholder"
          ls dist/
