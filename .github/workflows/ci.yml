name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.23']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go }}-

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './.toolchain/*'))
          if [ -n "$unformatted" ]; then
            echo "gofmt issues found in:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: Install staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2024.1.1

      - name: staticcheck
        run: staticcheck ./...

      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -severity medium -confidence medium ./... || true

      - name: govulncheck
        run: |
          go install golang.org/x/v/cmd/govulncheck@latest
          govulncheck ./...

      - name: go mod verify
        run: go mod verify

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Generate checksums
        run: go mod download && go list -m -json all | jq -r '.path+" "+.sum' > checksums.txt

      - name: Generate SBOM
        uses: cyclonedx/go-cyclonedx-module-action@v0
        with:
          version: latest

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: bom.json

      - name: OSV-Scanner
        uses: google/osv-scanner-action@v1
        with:
          args: --lockfile go.mod

  build:
    name: Build All Platforms
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-arm64
            goos: linux
            goarch: arm64
          - os: linux-amd64
            goos: linux
            goarch: amd64
          - os: darwin-arm64
            goos: darwin
            goarch: arm64
          - os: darwin-amd64
            goos: darwin
            goarch: amd64
          - os: windows-arm64
            goos: windows
            goarch: arm64
          - os: windows-amd64
            goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build ${{ matrix.os }}
        run: |
          export GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}
          go build -trimpath -ldflags "-s -w" -o dist/zonelint-${{ matrix.os }} ./cmd/zonelint
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: zonelint-${{ matrix.os }}
          path: dist/
